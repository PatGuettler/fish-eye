# Standalone repo: app at repository root (this folder).
# Same layout as flores-finance/.github/workflows/pages.yml — split build/deploy,
# upload-pages-artifact v4, verify via Vite bundle tags (no brittle /src/ greps).
name: Test, build, deploy GitHub Pages

on:
  push:
    branches: [main, master, vibe-tha-vibe]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Use `cache: npm` after committing package-lock.json (see flores-finance).

      - name: Install
        run: npm install

      - name: Unit tests
        run: |
          test -f f1040sc.pdf || (echo "Missing f1040sc.pdf at repo root (required for tests)" && exit 1)
          test -f schedulC.jpg || (echo "Missing schedulC.jpg at repo root (required for tests)" && exit 1)
          npm test

      - name: Set Pages base path
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            echo "VITE_BASE=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE=/${REPO}/" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: npm run build

      - name: Verify static output
        run: |
          test -f dist/index.html
          test -f dist/embed.html
          test -f dist/irs-demo.html
          test -f dist/embed-host.js
          test -f dist/host-chips.css
          test -f dist/404.html
          grep -q 'embed-host.js' dist/irs-demo.html
          grep -q 'import-schedule-c' dist/irs-demo.html
          test -f dist/.nojekyll
          grep -q 'script type="module"' dist/index.html || (echo "dist/index.html missing Vite bundle tags" && exit 1)
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "ERROR: dist/index.html still references dev /src/main.tsx — build did not run"
            exit 1
          fi
          ls -la dist/assets | head

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
