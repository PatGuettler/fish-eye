name: Test, build, deploy to GitHub Pages

# Assumes this repository root is the Vite app (this folder). In a monorepo,
# set `defaults.run.working-directory` to this subfolder and use that path for
# `upload-pages-artifact.path`.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Omit `cache: npm` until package-lock.json is committed (setup-node
          # requires package-lock.json, npm-shrinkwrap.json, or yarn.lock).

      - name: Install
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
