<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var path = location.pathname;
        if (/\/irs-demo\/?$/i.test(path)) {
          location.replace(path.replace(/\/irs-demo\/?$/i, "/irs-demo.html"));
          return;
        }
        var base = path.replace(/\/[^/]*$/, "/");
        location.replace(base + "index.html");
      })();
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
