<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule C widget — host example</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 32rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      label {
        display: block;
        margin: 1rem 0 0.35rem;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 0.5rem;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Your tax portal</h1>
    <p>
      This page shows how to embed the Schedule C popup. Parsed values are never
      written automatically — users drag chips onto your fields (or click to
      copy).
    </p>
    <button type="button" id="import-btn">Import Schedule C</button>

    <label for="box13">Box 13</label>
    <input id="box13" data-field="scheduleC.box13" />

    <label for="box30">Box 30</label>
    <input id="box30" data-field="scheduleC.box30" />

    <label for="box31">Box 31</label>
    <input id="box31" data-field="scheduleC.box31" />

    <div id="parsed-chips-host" class="host-chips" hidden style="margin-top:1rem"></div>

    <script src="./embed-host.js" defer></script>
    <style>
      .host-chips[hidden] { display: none !important; }
      .host-chips__list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.4rem; max-height: 240px; overflow-y: auto; }
      .host-chip { display: inline-flex; gap: 0.35rem; padding: 0.35rem 0.55rem; border-radius: 999px; border: 1px solid #6366f1; background: #eef2ff; cursor: grab; font-size: 0.8rem; }
      .host-chip__label { font-weight: 700; color: #4338ca; }
    </style>
    <script>
      document.getElementById("import-btn").addEventListener("click", () => {
        ScheduleCWidget.open({
          baseUrl: ScheduleCWidget.baseUrl,
          parsedPanel: "#parsed-chips-host",
        });
      });
    </script>
  </body>
</html>
